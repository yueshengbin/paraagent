# Paper-aligned eight-GPU training configuration; see docs/training.md.
defaults:
  - agent_ppo_trainer
  - _self_
hydra:
  searchpath:
    - pkg://paraagent.training.config
    - pkg://verl.trainer.config
algorithm:
  adv_estimator: gdpo
  gdpo_reward_keys: [R_traj, R_phase, R_format_score]
  gdpo_reward_weights: [1.0, 0.5, 0.25]
  use_kl_in_reward: false
data:
  train_files: data/rl/paraagent-rl/train.parquet
  val_files: data/rl/paraagent-rl/validation.parquet
  train_batch_size: 256
  val_batch_size: 124
  max_prompt_length: 16000
  max_response_length: 10240
  filter_overlong_prompts: false
  truncation: left
  return_raw_chat: true
  apply_chat_template_kwargs:
    enable_thinking: true
actor_rollout_ref:
  model:
    path: outputs/paraagent-sft
    use_remove_padding: true
    use_fused_kernels: true
    fused_kernel_options:
      impl_backend: torch
    enable_gradient_checkpointing: true
  actor:
    optim:
      lr: 1.0e-6
    ppo_mini_batch_size: 128
    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 163840
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    entropy_coeff: 0
    fsdp_config:
      param_offload: false
      optimizer_offload: false
  rollout:
    name: vllm
    mode: async
    n: 8
    temperature: 1.0
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.85
    enable_sleep_mode: true
    prompt_length: 16000
    response_length: 1536
    max_model_len: 18048
    max_num_batched_tokens: 98304
    log_prob_max_token_len_per_gpu: 98304
    agent:
      default_agent_flow: agent_env_loop
      max_steps: 15
      max_concurrent_trajectories_per_worker: 22
      max_concurrent_judge_per_worker: 10
  ref:
    fsdp_config:
      param_offload: false
    log_prob_max_token_len_per_gpu: 98304
reward:
  custom_reward_function:
    path: src/paraagent/rewards/tool_reward.py
    name: compute_score
trainer:
  use_legacy_worker_impl: disable
  logger: [console, file]
  project_name: paraagent
  experiment_name: paraagent-rl
  n_gpus_per_node: 8
  nnodes: 1
  total_epochs: 2
  total_training_steps: null
  save_freq: 30
  test_freq: -1
  val_before_train: false
  default_local_dir: outputs/paraagent-rl
  rollout_data_dir: null
  resume_mode: auto
