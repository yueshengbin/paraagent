<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 128" role="img" aria-labelledby="title description">
  <title id="title">ParaAgent</title>
  <desc id="description">ParaAgent wordmark</desc>
  <style>
    .agent { fill: #172554; }
    .rule-secondary { stroke: #172554; }
    @media (prefers-color-scheme: dark) {
      .agent { fill: #f8fafc; }
      .rule-secondary { stroke: #f8fafc; }
    }
  </style>
  <defs>
    <linearGradient id="para-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4c15d"/>
      <stop offset="1" stop-color="#b87318"/>
    </linearGradient>
  </defs>
  <text x="360" y="84" text-anchor="middle" font-size="76" letter-spacing="-2">
    <tspan fill="url(#para-gold)" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="700">Para</tspan><tspan class="agent" font-family="'Avenir Next', 'Segoe UI', Arial, sans-serif" font-style="normal" font-weight="750">Agent</tspan>
  </text>
  <path d="M166 105 H350" fill="none" stroke="#d49a32" stroke-width="3" stroke-linecap="round"/>
  <path class="rule-secondary" d="M370 105 H554" fill="none" stroke-width="3" stroke-linecap="round"/>
  <circle cx="360" cy="105" r="4.5" fill="#d49a32"/>
</svg>
